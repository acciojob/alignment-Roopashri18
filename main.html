<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>HTML Assignment 3</title>
	<style>
		h1 { text-align: center; font-size: 1.1rem; margin: 0; }

		table, th, td { border: 1px solid black; }
		table { border-collapse: separate; border-spacing: 1px; width: 100%; }
		td { padding: 1px; }

		.middle { margin: 0 auto 40px; }
		.center { text-align: center; }
		.right { text-align: right; }

		.green { background-color: green; }
		.blue { background-color: blue; }

		#t-image { text-align: center; }
		#t-image img { width: 240px; height: 170px; display: block; margin: 0 auto; }
		#table-3 td { height: 170px; }
		#table-3 tr:first-child td, #table-3 tr:last-child td { height: 20px; }
	</style>
</head>
<body>

	<h1>HTML Assignment #3</h1>

	<!-- Table 1 -->
	<table class="middle" id="table-1" cellspacing="1" cellpadding="1">
		<tr>
			<td id="t11">left</td>
			<td id="t12" class="center">center</td>
			<td id="t13" class="right">right</td>
		</tr>
		<tr>
			<td>left</td>
			<td class="center">center</td>
			<td class="right">right</td>
		</tr>
		<tr>
			<td>left</td>
			<td class="center">center</td>
			<td class="right">right</td>
		</tr>
	</table>

	<!-- Table 2: 6 rows x 6 columns, first row is a single cell -->
	<table class="middle" id="table-2" cellspacing="1" cellpadding="1">
		<tr>
			<td id="t21" colspan="6">&nbsp;</td>
		</tr>
		<tr>
			<td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
		</tr>
		<tr>
			<td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
		</tr>
		<tr>
			<td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
		</tr>
		<tr>
			<td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
		</tr>
		<tr>
			<td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
		</tr>
	</table>

	<!-- Table 3 -->
	<table class="middle" id="table-3" cellspacing="1" cellpadding="1">
		<tr class="green">
			<td colspan="3" class="green">&nbsp;</td>
		</tr>
		<tr>
			<td>&nbsp;</td>
			<td id="t-image"><img src="https://www2.d125.org/applied_arts/teched/courses/WEB/portfolios/2013_FallP3/Luthra%20Portfolio/images-1.jpeg" alt="Table image"></td>
			<td>&nbsp;</td>
		</tr>
		<tr class="blue">
			<td colspan="3" class="blue">&nbsp;</td>
		</tr>
	</table>

</body>
</html>
